name: Terraform Network Prod

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-network-prod.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-network-prod.yml"
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run terraform apply with reviewed plan artifact"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write
  issues: write

env:
  AWS_REGION: ap-southeast-1
  TF_WORKING_DIR: infra/stacks/network-prod
  TF_VARS_FILE: ../../env/prod/network-prod.tfvars

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "Verifying assumed role..."
          aws sts get-caller-identity --output json

      - name: Check prod backend bucket exists
        run: |
          # backend bucket used by infra/stacks/network-prod/backend.tf
          BUCKET=swl-agentic-ai-prod-state-file-851725184910-ap-southeast-1-an
          echo "Checking S3 bucket: $BUCKET"
          aws s3api head-bucket --bucket "$BUCKET"

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} fmt -check -recursive

      - name: Backend policy check
        run: |
          set -e
          grep -R 'backend "s3"' ${{ env.TF_WORKING_DIR }}/*.tf || (echo "S3 backend not found in ${TF_WORKING_DIR}" && exit 1)
          grep -R 'use_lockfile = true' ${{ env.TF_WORKING_DIR }}/*.tf || (echo "state locking not enabled in ${TF_WORKING_DIR}" && exit 1)

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: Terraform plan
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} plan -var-file=${{ env.TF_VARS_FILE }} -out=tfplan -input=false -no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-prod-tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 14

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: (github.event_name == 'workflow_dispatch' && inputs.run_apply == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Require manual approval (PR comment '/apply' or file)
        uses: actions/github-script@v6
        with:
          script: |
            // Auto-approve for direct pushes to main
            if (context.eventName === 'push' && context.ref === 'refs/heads/main') {
              core.info('Push to main — skipping manual approval.');
              return;
            }

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            let approved = false;

            if (prs && prs.length > 0) {
              for (const pr of prs) {
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                });
                for (const c of comments.data) {
                  if (typeof c.body === 'string' && c.body.trim() === '/apply') {
                    approved = true;
                    break;
                  }
                }
                if (approved) break;
              }
              if (!approved) {
                throw new Error('No /apply comment found on associated PR(s). Add a comment with exactly `/apply` to approve.');
              }
            } else {
              try {
                const content = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: '.github/terraform-apply-approve',
                  ref: context.ref.replace('refs/heads/', '')
                });
                if (!content || !content.data) {
                  throw new Error('Approval file not found');
                }
              } catch (err) {
                throw new Error('No PR associated with this run and approval file .github/terraform-apply-approve not found on branch. Create that file on the branch or comment `/apply` on the PR.');
              }
            }

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: network-prod-tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply reviewed plan
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} apply -input=false -auto-approve tfplan
