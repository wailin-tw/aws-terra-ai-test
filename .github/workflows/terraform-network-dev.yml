name: Terraform Network Dev

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-network-dev.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-network-dev.yml"
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run terraform apply with reviewed plan artifact"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  TF_WORKING_DIR: infra/stacks/network-dev
  TF_VARS_FILE: ../../env/dev/network-dev.tfvars

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "Verifying assumed role..."
          aws sts get-caller-identity --output json > caller.json || true
          cat caller.json

      - name: Post AWS identity to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('caller.json', 'utf8');
            const prNumber = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: 'AWS identity (assumed role):\n```json\n' + body + '\n```'
            });

      - name: Debug runner info
        run: |
          echo "Runner debug (non-secret vars):"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "AWS_REGION=${AWS_REGION}"
          echo "TF_WORKING_DIR=${TF_WORKING_DIR}"
          echo "TF_VARS_FILE=${TF_VARS_FILE}"
          aws --version || true
          terraform -version || true

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} fmt -check -recursive

      - name: Backend policy check
        run: |
          set -e
          grep -R 'backend "s3"' ${{ env.TF_WORKING_DIR }}/*.tf || (echo "S3 backend not found in ${TF_WORKING_DIR}" && exit 1)
          grep -R 'use_lockfile = true' ${{ env.TF_WORKING_DIR }}/*.tf || (echo "state locking not enabled in ${TF_WORKING_DIR}" && exit 1)

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: Terraform plan
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} plan -var-file=${{ env.TF_VARS_FILE }} -out=tfplan -input=false -no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-dev-tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 14

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.run_apply == 'true'
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "Verifying assumed role..."
          aws sts get-caller-identity --output json

      - name: Debug runner info
        run: |
          echo "Runner debug (non-secret vars):"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "AWS_REGION=${AWS_REGION}"
          echo "TF_WORKING_DIR=${TF_WORKING_DIR}"
          echo "TF_VARS_FILE=${TF_VARS_FILE}"
          aws --version || true
          terraform -version || true

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: network-dev-tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply reviewed plan
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} apply -input=false -auto-approve tfplan