name: Terraform Network Dev

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-network-dev.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-network-dev.yml"
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run terraform apply with reviewed plan artifact"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  TF_WORKING_DIR: infra/stacks/network-dev
  TF_VARS_FILE: ../../env/dev/network-dev.tfvars

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Backend policy check
        run: |
          grep -R 'backend "s3"' infra/stacks/network-dev/*.tf
          grep -R 'use_lockfile = true' infra/stacks/network-dev/*.tf

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Require manual approval (PR comment '/apply' or file)
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            let approved = false;

            if (prs && prs.length > 0) {
              // Check the most relevant PRs for an '/apply' comment
              for (const pr of prs) {
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                });
                for (const c of comments.data) {
                  if (typeof c.body === 'string' && c.body.trim() === '/apply') {
                    approved = true;
                    break;
                  }
                }
                if (approved) break;
              }
              if (!approved) {
                core.setFailed('No /apply comment found on associated PR(s). Add a comment with exactly `/apply` to approve.');
              }
            } else {
              // No PR associated with this commit; check for file on the branch
              try {
                const content = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: '.github/terraform-apply-approve',
                  ref: context.ref.replace('refs/heads/', '')
                });
                if (content && content.data) {
                  approved = true;
                }
              } catch (err) {
                core.setFailed('No PR associated with this run and approval file .github/terraform-apply-approve not found on branch. Create that file on the branch or comment \'/apply\' on the PR.');
              }
            }

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: Terraform plan
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} plan -var-file=${{ env.TF_VARS_FILE }} -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-dev-tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 14

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.run_apply == 'true'
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: network-dev-tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply reviewed plan
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} apply -auto-approve tfplan